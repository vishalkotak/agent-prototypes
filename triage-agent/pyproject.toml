[project]
name = "triage-agent"
version = "0.1.0"
description = "Tool-dispatch layer for an incident triage agent."
requires-python = ">=3.11"
dependencies = [
    "openai",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
